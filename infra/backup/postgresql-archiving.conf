# Include from postgresql.conf. With archive_timeout=60 a WAL segment is shipped at least every
# minute, which keeps the recovery point objective well under the 15-minute target.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --config=/var/lib/pgbackrest/pgbackrest.conf --stanza=opes archive-push %p'
archive_timeout = 60
max_wal_senders = 5
