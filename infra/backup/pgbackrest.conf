# pgBackRest configuration for continuous WAL archiving and point-in-time recovery (plan item E1).
# Repository is encrypted (AES-256-CBC) and stored in a separate, write-once S3 bucket.
[global]
repo1-type=s3
repo1-s3-endpoint=${BACKUP_S3_ENDPOINT}
repo1-s3-bucket=${BACKUP_S3_BUCKET}
repo1-s3-region=${BACKUP_S3_REGION}
repo1-s3-key=${BACKUP_S3_KEY}
repo1-s3-key-secret=${BACKUP_S3_SECRET}
repo1-path=/opes-maintain
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${BACKUP_CIPHER_PASS}
repo1-retention-full=4
repo1-retention-archive=35
repo1-retention-archive-type=time
compress-type=zst
process-max=2
start-fast=y
log-level-console=info

[opes]
pg1-path=/var/lib/postgresql/data

# Schedule (cron on the database host or a Kubernetes CronJob):
#   0 1 * * 0    pgbackrest --stanza=opes --type=full backup
#   0 1 * * 1-6  pgbackrest --stanza=opes --type=diff backup
