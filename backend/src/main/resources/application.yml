spring:
  application:
    name: opes-maintain
  datasource:
    url: ${OPES_DB_URL:jdbc:h2:file:./data/opes-maintain;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,YEAR,KEY,MONTH,DAY}
    username: ${OPES_DB_USER:sa}
    password: ${OPES_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

opes:
  production: ${OPES_PRODUCTION:false}
  security:
    mfa-required: ${OPES_MFA_REQUIRED:false}
    cors-origins: ${OPES_CORS_ORIGINS:}
    login-per-minute: ${OPES_LOGIN_PER_MINUTE:20}
    # Override in every non-development environment (managed secret).
    token-secret: ${OPES_TOKEN_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-ttl-seconds: 28800
  storage:
    root: ${OPES_STORAGE_ROOT:./data/files}
  seed:
    demo: ${OPES_SEED_DEMO:true}
  jobs:
    enabled: ${OPES_JOBS_ENABLED:true}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${OPES_DB_URL:jdbc:postgresql://localhost:5432/opes_maintain}
    username: ${OPES_DB_USER:opes}
    password: ${OPES_DB_PASSWORD:opes}
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
opes:
  production: true
  seed:
    demo: false
  security:
    mfa-required: ${OPES_MFA_REQUIRED:true}
